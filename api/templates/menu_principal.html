<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Financeiro - Menu Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
        }
        .btn-menu {
            height: 200px;
            border-radius: 15px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .btn-menu:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-menu i {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg" style="max-width: 800px; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-4">
                <h1 class="mb-2">
                    <i class="fas fa-chart-line"></i>
                    Sistema Financeiro
                </h1>
                <p class="mb-0 fs-5">Bem-vindo ao Sistema Financeiro. Escolha abaixo o que deseja fazer:</p>
            </div>
            <div class="card-body p-5">
                <div class="row g-4">
                    <div class="col-md-6">
                        <a href="/extracao/" class="btn btn-outline-primary btn-menu w-100 d-flex flex-column align-items-center justify-content-center text-decoration-none">
                            <i class="fas fa-file-invoice text-primary"></i>
                            <h4 class="text-primary mb-2">Fazer Extração de Nota Fiscal</h4>
                            <p class="text-muted mb-0">Upload e processamento automático de NFe</p>
                        </a>
                    </div>
                    <div class="col-md-6">
                        <a href="/gerenciar/" class="btn btn-outline-success btn-menu w-100 d-flex flex-column align-items-center justify-content-center text-decoration-none">
                            <i class="fas fa-database text-success"></i>
                            <h4 class="text-success mb-2">Gerenciar Cadastros</h4>
                            <p class="text-muted mb-0">Visualizar e editar dados salvos no sistema</p>
                        </a>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <div class="col-12 text-center">
                        <hr>
                        <p class="text-muted">
                            <i class="fas fa-info-circle"></i>
                            Sistema desenvolvido para extração e gerenciamento de dados financeiros
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
